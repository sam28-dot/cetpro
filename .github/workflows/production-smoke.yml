name: Production smoke checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render API endpoint
        env:
          API_HEALTH_URL: https://cetpro-backend.onrender.com/api/health
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 -o /tmp/health.json -w '%{http_code}' "$API_HEALTH_URL" || true)"
          body="$(cat /tmp/health.json 2>/dev/null || true)"
          if [ "$status" != "200" ]; then
            echo "Render API endpoint failed with HTTP $status"
            printf '%s\n' "$body"
            exit 1
          fi
          printf '%s' "$body" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try {
                const h = JSON.parse(s);
                if (!(h.success === true || h.status === "OK" || h.status === "healthy")) {
                  console.error("Unexpected health response:", JSON.stringify(h));
                  process.exit(1);
                }
                if (h.database) {
                  console.log("API reachable; database status:", h.database);
                } else {
                  console.log("API reachable. This deployed health endpoint does not expose database status.");
                }
                if (h.historicalCutoffs) {
                  console.log("Cutoff records reported:", h.historicalCutoffs.records);
                } else {
                  console.log("Cutoff dataset count is not exposed by the currently deployed health endpoint.");
                }
              } catch (e) {
                console.error("API did not return valid JSON:", e.message);
                process.exit(1);
              }
            });
          '

      - name: Check public frontend responds
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://cetpro-predictor.vercel.app/ -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html
          echo "Vercel frontend returned HTML successfully."
